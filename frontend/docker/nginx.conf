# NOTE: This file is a template. The actual configuration is generated
# at container startup from nginx.conf.template using envsubst.
# Environment variables:
#   NGINX_SERVER_NAME     - server name (default: localhost)
#   SSL_CERT_PATH         - path to SSL certificate (if empty, HTTPS is disabled)
#   SSL_KEY_PATH          - path to SSL private key
#   SSL_CA_PATH           - path to CA bundle (optional)

server {
    listen 80;
    {{#SSL_CERT_PATH}}
    listen 443 ssl;
    {{/SSL_CERT_PATH}}
    server_name ${NGINX_SERVER_NAME};
    root /usr/share/nginx/html;
    index index.html;

    # SSL Certificate from env
    {{#SSL_CERT_PATH}}
    ssl_certificate ${SSL_CERT_PATH};
    ssl_certificate_key ${SSL_KEY_PATH};
    {{/SSL_CERT_PATH}}
    {{#SSL_CA_PATH}}
    ssl_trusted_certificate ${SSL_CA_PATH};
    {{/SSL_CA_PATH}}
    {{#SSL_CERT_PATH}}
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    {{/SSL_CERT_PATH}}

    # Handle SPA routes
    location / {
        try_files $uri @spa;
    }

    location @spa {
        try_files /index.html =404;
    }

    # Serve static assets - only actual files with known extensions
    location ~ ^/assets/.+\.[a-zA-Z0-9]+$ {
        try_files $uri =404;
    }

    location /api {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_cache_bypass $http_upgrade;
    }

    location /static {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }
}
